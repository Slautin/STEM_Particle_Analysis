# Particle digital twin for testing this project.
#
# Copy of asyncroscopy configs/digital_twin_particles.yaml with a corrector added,
# so the C1/A1 tools (DigitalTwinCorrector_correct_aberration) exist on MCP.
# Relative paths below resolve inside ASYNCROSCOPY_DIR, not this repo.
#
# Start with: uv run python scripts/twin.py start

instrument:
  class_name: DigitalTwinParticles
  file: asyncroscopy/instruments/electron_microscope/digital_twin_particles.py
  description: "Voxel-backed oriented-particle HAADF/EDS digital twin"
  timeout_seconds: 120
  properties:
    sample_seed: 12345
    sample_particle_count: 40
    world_imsize: 128          # scripts/twin.py sets scan.imsize to the same value (EDS needs it)

devices:
  data:
    module_name: asyncroscopy.data.data
  eds:
    module_name: asyncroscopy.instruments.electron_microscope.detectors.eds
  scan:
    module_name: asyncroscopy.instruments.electron_microscope.hardware.scan
  stage:
    class_name: TestStage
    module_name: asyncroscopy.instruments.electron_microscope.hardware.TestStage
  corrector:
    class_name: DigitalTwinCorrector
    module_name: asyncroscopy.instruments.electron_microscope.hardware.corrector_digital_twin

tango:
  host: 127.0.0.1
  port: 9094
  reset_database_file: true

tiled:
  host: 127.0.0.1
  port: 9091
  acquisition_dir: outputs/tiled_acquisitions
  autostart: true
  register_on_startup: false

device_timeout_seconds: 120
