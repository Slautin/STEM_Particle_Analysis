[project]
name = "stem-agent"
version = "0.1.0"
description = "LangGraph agent for STEM particle analysis over the asyncroscopy MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.19",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "tiled[client]>=0.2.21",
]

[project.optional-dependencies]
sam = [
    "segment-anything>=1.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stem_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
